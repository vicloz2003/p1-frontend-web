<mat-toolbar color="primary">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Nombre de la política</mat-label>
    <input matInput [value]="policyName()" (input)="onNameInput($event)" />
  </mat-form-field>
  <span style="flex: 1"></span>
  <button mat-stroked-button
          (click)="openIaDialog()"
          style="margin-right:8px;"
          matTooltip="Generar diagrama con IA">
    <mat-icon>auto_awesome</mat-icon>
    Generar con IA
  </button>
  @if (policyId()) {
    <button mat-stroked-button
            (click)="startCollaboration()"
            [disabled]="collaborating"
            style="margin-right:8px;"
            matTooltip="Activar edición colaborativa">
      <mat-icon>group</mat-icon>
      {{ collaborating ? 'Colaborando' : 'Colaborar' }}
    </button>
  }
  <button mat-raised-button (click)="savePolicy()">Guardar Política</button>
</mat-toolbar>

<div class="designer-body">
  <div #canvas class="canvas-container"></div>
  <app-lane-panel
    [lanes]="lanes()"
    [departments]="departments()"
    (departmentAssigned)="onDepartmentAssigned($event)"
  />
</div>
