<mat-toolbar color="primary">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Nombre de la política</mat-label>
    <input matInput [value]="policyName()" (input)="onNameInput($event)" />
  </mat-form-field>
  <span style="flex: 1"></span>
  <button mat-raised-button (click)="savePolicy()">Guardar Política</button>
</mat-toolbar>

<div class="designer-body">
  <div #canvas class="canvas-container"></div>
  <app-lane-panel
    [lanes]="lanes()"
    [departments]="departments()"
    (departmentAssigned)="onDepartmentAssigned($event)"
  />
</div>
